name: Deploy JupyterBook to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and build dependencies
        run: |
          pip install -e ".[dev]"
          # Pin JupyterBook to v1: v2 is the mystmd rewrite with a different CLI
          # and output path, which breaks `jupyter-book build book` -> book/_build/html.
          pip install "jupyter-book>=1,<2" ipykernel matplotlib scikit-learn scipy PyWavelets
          # scanpy + anndata so weeks 5-6 render on the real pbmc3k single-cell data
          # (heavier build: pulls numba/llvmlite/h5py and downloads pbmc3k)
          pip install scanpy anndata
          # wfdb so weeks 4 & 7 fetch the real MIT-BIH ECG from PhysioNet; without it
          # get_dataset("mitbih") drops to a labeled synthetic fallback on the site.
          pip install wfdb

      - name: Register IPython kernel
        run: |
          python -m ipykernel install --user --name python3 --display-name "Python 3"

      - name: Warm the dataset cache
        run: |
          # Download the datasets the lessons use INTO THE CACHE before the timed
          # build, so notebook cells read cached data instead of downloading inside
          # a timeout-limited cell (a cold BloodMNIST fetch once exceeded the cell
          # timeout and broke wk1). This step has no per-cell timeout. Only the
          # lesson datasets are warmed -- not heavy unused ones (TCGA/MNE/IXI).
          python -c "from ddm4bio.datasets import get_dataset; [print('  ['+get_dataset(k).source+']', k) for k in ['bloodmnist','breast_wisconsin','gdsc','heart_uci','jhu_covid','mitbih','pbmc3k']]"

      - name: Build the book
        run: |
          jupyter-book build book

      - name: Guard against fallbacks and lesson errors
        run: |
          # When a real dataset fetch fails on the runner (a heavy dep missing here,
          # or a source/network outage), get_dataset returns a LABELED synthetic
          # fallback: source="fallback" and a provenance beginning
          # "synthetic/bundled fallback:". Those strings render in a lesson's OUTPUT
          # only when a real fetch actually failed -- unlike the deliberate synthetic
          # ground-truth fixtures (make_sparse_signal, injected sources), which never
          # emit them. Fail the deploy so a regressed (fallback) site is never
          # published. If a lesson ever intentionally ships a fallback dataset,
          # narrow this pattern or scope it past that page.
          pattern='source[[:space:]=:]+fallback|synthetic/bundled fallback:'
          if grep -rInoE "$pattern" book/_build/html/lessons/; then
            echo "::error::A lesson fell back to synthetic data on the build runner (a real dataset fetch failed -- most likely a heavy dependency missing from this workflow's pip install, e.g. wfdb or scanpy). The site was NOT published; fix the install and re-run."
            exit 1
          fi
          # Also fail if any lesson rendered an execution error/traceback (a cell
          # that errored or timed out during the build). A crash is NOT a fallback,
          # so the pattern above misses it -- this is exactly what broke wk1.
          if grep -rInoE 'Traceback \(most recent call last\)|CellExecutionError|CellTimeoutError' book/_build/html/lessons/; then
            echo "::error::A lesson rendered an execution error/traceback (a cell failed or timed out during the build). The site was NOT published; fix the failing cell."
            exit 1
          fi
          echo "Lesson guard passed: every dataset fetched real and no cell errored."

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (GitHub Actions source) on first run, so no manual
          # Settings toggle is needed. Requires the plan to permit Pages: a
          # PRIVATE repo needs GitHub Pro/Team/Enterprise; on a free plan the repo
          # must be Public for this to succeed.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book/_build/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

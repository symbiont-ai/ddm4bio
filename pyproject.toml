[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ddm4bio"
version = "0.1.0"
description = "Data-Driven Modeling & Scientific Computation for the Life Sciences (course library)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ilknur Icke" }]
keywords = ["scientific-computing", "life-sciences", "data-driven-modeling", "course"]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "scikit-learn",
    "matplotlib",
]

# "Light core + heavy extras" is a deliberate Phase 0 decision: `make setup`
# installs only the core stack + dev tools so a clean clone sets up fast.
# Area-specific heavy deps are opt-in, e.g. `pip install -e ".[dynamics]"`.
[project.optional-dependencies]
dev = ["ruff", "pytest", "nbmake", "jupytext", "mypy"]
signals = ["PyWavelets", "mne", "wfdb"]
singlecell = ["scanpy", "anndata"]
dynamics = ["pysindy", "pydmd"]
dl = ["torch"]
imaging = ["medmnist", "scikit-image", "nibabel"]
viz = ["seaborn"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: test requires live network access to a real dataset source (deselect with '-m \"not network\"')",
]
